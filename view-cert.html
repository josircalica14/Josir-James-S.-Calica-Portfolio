<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Viewer | Josir James S. Calica</title>
    <link rel="stylesheet" href="style.css?v=19">
    <link rel="stylesheet" href="css/view-cert.css?v=2">
    <link rel="stylesheet" href="theme-toggle.css">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark-mode';
            document.documentElement.className = theme;
        })();
    </script>
</head>
<body class="dark-mode">
    <!-- Mobile Navigation -->
    <input type="checkbox" id="mobile-nav-toggle" class="mobile-nav__checkbox">
    <div class="mobile-nav__bar"></div>
    <div class="mobile-logo">
        <img class="logo-light" src="./logo/logo1v2.webp" alt="Cup of Jay">
        <img class="logo-dark" src="./logo/logo1v1.webp" alt="Cup of Jay">
    </div>
    <label for="mobile-nav-toggle" class="mobile-burger">
        <span></span><span></span><span></span>
    </label>
    <label for="mobile-nav-toggle" class="mobile-nav__backdrop"></label>
    <div class="nav-blur-strip" aria-hidden="true"></div>
    <nav class="mobile-nav__drawer" aria-label="Mobile navigation">
        <div class="mobile-nav__header">
            <img class="logo-light mobile-nav__header-logo" src="./logo/logo1v2.webp" alt="Cup of Jay">
            <img class="logo-dark mobile-nav__header-logo" src="./logo/logo1v1.webp" alt="Cup of Jay">
            <span class="mobile-nav__header-name">Cup of Jay</span>
        </div>
        <ul class="mobile-nav__list"></ul>
    </nav>

    <!-- Desktop Navigation -->
    <nav class="nav" aria-label="Main navigation">
        <div class="nav__logo-item">
            <img class="nav__logo-image logo-light" src="./logo/logo1v2.webp" alt="Cup of Jay">
            <img class="nav__logo-image logo-dark" src="./logo/logo1v1.webp" alt="Cup of Jay">
        </div>
        <ul class="nav__main-list"></ul>
    </nav>

    <!-- Theme toggle -->
    <div class="nav__toggle-item">
        <div class="theme-toggle theme-toggle--nav">
            <label class="switch" for="theme-checkbox" aria-label="Toggle theme">
                <input type="checkbox" id="theme-checkbox" class="theme-toggle__input">
                <span class="slider">
                    <span class="stars">
                        <svg class="star" viewBox="0 0 24 24"><path d="M12 0L14.59 8.41L23 11L14.59 13.59L12 22L9.41 13.59L1 11L9.41 8.41L12 0Z"/></svg>
                        <svg class="star" viewBox="0 0 24 24"><path d="M12 0L14.59 8.41L23 11L14.59 13.59L12 22L9.41 13.59L1 11L9.41 8.41L12 0Z"/></svg>
                        <svg class="star" viewBox="0 0 24 24"><path d="M12 0L14.59 8.41L23 11L14.59 13.59L12 22L9.41 13.59L1 11L9.41 8.41L12 0Z"/></svg>
                        <svg class="star" viewBox="0 0 24 24"><path d="M12 0L14.59 8.41L23 11L14.59 13.59L12 22L9.41 13.59L1 11L9.41 8.41L12 0Z"/></svg>
                        <svg class="star" viewBox="0 0 24 24"><path d="M12 0L14.59 8.41L23 11L14.59 13.59L12 22L9.41 13.59L1 11L9.41 8.41L12 0Z"/></svg>
                    </span>
                    <span class="moons-hole">
                        <span class="moon-hole"></span><span class="moon-hole"></span><span class="moon-hole"></span>
                    </span>
                    <span class="black-clouds">
                        <span class="black-cloud"></span><span class="black-cloud"></span><span class="black-cloud"></span>
                    </span>
                    <span class="clouds">
                        <span class="cloud"></span><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span>
                        <span class="cloud"></span><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span>
                    </span>
                </span>
            </label>
        </div>
    </div>

    <main class="cert-viewer">
        <div class="cert-viewer__topbar">
            <a class="cert-viewer__back" href="javascript:history.back()">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8 9 2.5l1.4 1.4L6.3 8l4.1 4.1L9 13.5Z" fill="currentColor"/></svg>
                Back
            </a>
            <span class="cert-viewer__title" id="cert-title"></span>
            <button class="cert-viewer__download" id="cert-download" type="button" hidden>
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11 3.5 6.5 4.9 5.1 7 7.2V1h2v6.2l2.1-2.1 1.4 1.4ZM2 13h12v2H2Z" fill="currentColor"/></svg>
                Download
            </button>
        </div>

        <div class="cert-viewer__canvas-wrap" id="canvas-wrap">
            <div class="cert-viewer__loading" id="loading">
                <span>Loading certificate…</span>
            </div>
        </div>
    </main>

    <script type="module" src="main.js?v=24"></script>
    <script src="lib/libgif.js" defer></script>
    <script type="module" src="lib/web-pet-engine.js"></script>
    <script src="lib/pdf.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const file   = params.get('file');
        const img    = params.get('img');
        const title  = params.get('title');

        const wrap    = document.getElementById('canvas-wrap');
        const loading = document.getElementById('loading');

        if (!file && !img) {
            loading.querySelector('span').textContent = 'No certificate specified.';
        } else {
            // Title
            const rawName = title
                ? decodeURIComponent(title)
                : decodeURIComponent((file || img).split('/').pop()).replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
            document.getElementById('cert-title').textContent = rawName;
            document.title = rawName + ' | Josir James S. Calica';

            // Download button — a real <button>, not a link: nothing on this page
            // has an href pointing at the file, so merely loading the certificate
            // can never trigger the browser's download UI. The bytes are fetched
            // only on click, then saved through a temporary object URL.
            const dl = document.getElementById('cert-download');
            const dlFile = file || img;
            dl.addEventListener('click', () => {
                dl.disabled = true;
                fetch(dlFile)
                    .then(r => r.blob())
                    .then(blob => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = decodeURIComponent(dlFile.split('/').pop());
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(() => URL.revokeObjectURL(url), 1000);
                    })
                    .finally(() => { dl.disabled = false; });
            });

            // --- Show image fallback ---
            const showImage = () => {
                if (!img) {
                    loading.querySelector('span').textContent = 'Could not render PDF in this environment.';
                    return;
                }
                loading.style.display = 'none';
                const image = document.createElement('img');
                image.src = img;
                image.alt = rawName;
                image.className = 'cert-viewer__page';
                wrap.appendChild(image);
                dl.hidden = false;
            };

            // --- Try PDF.js first ---
            if (file && typeof pdfjsLib !== 'undefined') {
                pdfjsLib.GlobalWorkerOptions.workerSrc = './lib/pdf.worker.min.js';
                const pdfUrl = new URL(file, window.location.href).href;

                // Fetch as blob first — bypasses any Content-Disposition: attachment
                // header the server might send, which would otherwise trigger a download
                fetch(pdfUrl)
                    .then(res => res.arrayBuffer())
                    .then(buffer => pdfjsLib.getDocument({ data: buffer }).promise)
                    .then(pdf => {
                    loading.style.display = 'none';
                    dl.hidden = false;

                    const renderPage = (num) => pdf.getPage(num).then(page => {
                        const dpr      = Math.min(window.devicePixelRatio || 1, 2);
                        const baseVp   = page.getViewport({ scale: 1 });
                        const scale    = (wrap.clientWidth / baseVp.width) * dpr;
                        const viewport = page.getViewport({ scale });

                        const canvas = document.createElement('canvas');
                        canvas.className = 'cert-viewer__page';
                        canvas.width  = viewport.width;
                        canvas.height = viewport.height;
                        canvas.style.width  = (viewport.width  / dpr) + 'px';
                        canvas.style.height = (viewport.height / dpr) + 'px';
                        wrap.appendChild(canvas);

                        return page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                    });

                    let chain = Promise.resolve();
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const n = i;
                        chain = chain.then(() => renderPage(n));
                    }
                }).catch(() => showImage());
            } else {
                showImage();
            }
        }
    </script>
</body>
</html>
